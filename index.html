<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Composition</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0b1020, var(--bg));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .card {
      width: min(700px, 100%);
      background: color-mix(in oklab, var(--card) 92%, black);
      border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      color: var(--accent);
    }

    p {
      line-height: 1.6;
      margin: 0.75rem 0;
    }

    .pill {
      display: inline-block;
      margin-top: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid color-mix(in oklab, var(--accent) 55%, transparent);
      color: var(--accent);
      background: color-mix(in oklab, var(--accent) 12%, transparent);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Music Composition</h1>
    <p>This is the first HTML page for the project.</p>
    <p>Use this as a starting point to build tools for writing, arranging, and exploring musical ideas.</p>
    <span class="pill">Starter page ready</span>
  </main>
</body>
</html>
